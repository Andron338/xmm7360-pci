# /etc/NetworkManager/conf.d/xmm7360.conf
#
# wwan0 is managed by NetworkManager via the LTE keyfile connection.
# IP configuration is handled by open_xdatachannel (via xmm7360-init.service)
# not by NM itself, so ipv4.method=disabled in the connection keyfile.
#
# Increase dispatcher timeout so our tool has time to complete the
# LTE attach sequence (init + network attach + data channel ~ 10-15s).
[main]
dispatcher-timeout=30
